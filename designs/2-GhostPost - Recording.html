<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhostPost - Recording</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        window.FontAwesomeConfig = { autoReplaceSvg: 'nest' };
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#131316',
                        card: '#1c1d23',
                        border: '#2a2b32',
                        primary: '#ffffff',
                        secondary: '#9ca3af',
                        accent: '#3b82f6',
                        accentHover: '#2563eb',
                        purple: '#8b5cf6',
                        success: '#22c55e',
                        danger: '#ef4444',
                    },
                    fontFamily: {
                        sans: ['DM Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    backgroundImage: {
                        'gradient-ghost': 'linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%)',
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'wave': 'wave 1.2s ease-in-out infinite',
                        'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
                    },
                    keyframes: {
                        wave: {
                            '0%, 100%': { height: '10%' },
                            '50%': { height: '100%' },
                        },
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <style>
        body {
            background-color: #131316;
            color: #ffffff;
            font-family: 'DM Sans', sans-serif;
            overflow: hidden;
        }
        .ghost-gradient-text {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .ghost-icon-bg {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
        }
        /* Audio Bar Animation Delays */
        .bar:nth-child(1) { animation-delay: 0.1s; }
        .bar:nth-child(2) { animation-delay: 0.3s; }
        .bar:nth-child(3) { animation-delay: 0.5s; }
        .bar:nth-child(4) { animation-delay: 0.2s; }
        .bar:nth-child(5) { animation-delay: 0.4s; }
        .bar:nth-child(6) { animation-delay: 0.1s; }
        .bar:nth-child(7) { animation-delay: 0.6s; }
        .bar:nth-child(8) { animation-delay: 0.3s; }
        .bar:nth-child(9) { animation-delay: 0.5s; }
        .bar:nth-child(10) { animation-delay: 0.2s; }
        .bar:nth-child(11) { animation-delay: 0.4s; }
        .bar:nth-child(12) { animation-delay: 0.1s; }
        .bar:nth-child(13) { animation-delay: 0.3s; }
        .bar:nth-child(14) { animation-delay: 0.5s; }
        .bar:nth-child(15) { animation-delay: 0.2s; }
        .bar:nth-child(16) { animation-delay: 0.4s; }
        .bar:nth-child(17) { animation-delay: 0.1s; }
        .bar:nth-child(18) { animation-delay: 0.6s; }
        .bar:nth-child(19) { animation-delay: 0.3s; }
        .bar:nth-child(20) { animation-delay: 0.5s; }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #131316; }
        ::-webkit-scrollbar-thumb { background: #2a2b32; border-radius: 3px; }
    </style>
</head>
<body class="h-screen w-full flex flex-col justify-between items-center relative selection:bg-accent selection:text-white">

    <!-- Top Navigation / Logo Area -->
    <header id="header" class="w-full flex justify-center pt-12 pb-6 z-10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full ghost-icon-bg flex items-center justify-center shadow-[0_0_20px_rgba(59,130,246,0.3)]">
                <i class="fa-solid fa-ghost text-white text-lg"></i>
            </div>
            <span class="text-2xl font-bold tracking-tight">GhostPost</span>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="main-content" class="flex-1 w-full max-w-[640px] flex flex-col items-center justify-center px-6 relative z-10">
        
        <!-- Rotating Prompt Text -->
        <div id="prompt-container" class="h-16 flex items-center justify-center mb-8 w-full text-center">
            <p id="prompt-text" class="text-xl md:text-2xl text-secondary font-medium animate-fade-in-up">
                "Tell me about yourself..."
            </p>
        </div>

        <!-- Waveform Visualizer -->
        <div id="visualizer" class="h-32 flex items-center justify-center gap-1.5 mb-10 w-full px-8">
            <!-- 20 Bars for visualizer -->
            <div class="bar w-2 bg-gradient-to-t from-accent to-purple rounded-full h-8 animate-wave"></div>
            <div class="bar w-2 bg-gradient-to-t from-accent to-purple rounded-full h-12 animate-wave"></div>
            <div class="bar w-2 bg-gradient-to-t from-accent to-purple rounded-full h-16 animate-wave"></div>
            <div class="bar w-2 bg-gradient-to-t from-accent to-purple rounded-full h-24 animate-wave"></div>
            <div class="bar w-2 bg-gradient-to-t from-accent to-purple rounded-full h-12 animate-wave"></div>
            <div class="bar w-2 bg-gradient-to-t from-accent to-purple rounded-full h-20 animate-wave"></div>
            <div class="bar w-2 bg-gradient-to-t from-accent to-purple rounded-full h-28 animate-wave"></div>
            <div class="bar w-2 bg-gradient-to-t from-accent to-purple rounded-full h-32 animate-wave"></div>
            <div class="bar w-2 bg-gradient-to-t from-accent to-purple rounded-full h-24 animate-wave"></div>
            <div class="bar w-2 bg-gradient-to-t from-accent to-purple rounded-full h-16 animate-wave"></div>
            <div class="bar w-2 bg-gradient-to-t from-accent to-purple rounded-full h-28 animate-wave"></div>
            <div class="bar w-2 bg-gradient-to-t from-accent to-purple rounded-full h-32 animate-wave"></div>
            <div class="bar w-2 bg-gradient-to-t from-accent to-purple rounded-full h-20 animate-wave"></div>
            <div class="bar w-2 bg-gradient-to-t from-accent to-purple rounded-full h-12 animate-wave"></div>
            <div class="bar w-2 bg-gradient-to-t from-accent to-purple rounded-full h-24 animate-wave"></div>
            <div class="bar w-2 bg-gradient-to-t from-accent to-purple rounded-full h-16 animate-wave"></div>
            <div class="bar w-2 bg-gradient-to-t from-accent to-purple rounded-full h-10 animate-wave"></div>
            <div class="bar w-2 bg-gradient-to-t from-accent to-purple rounded-full h-14 animate-wave"></div>
            <div class="bar w-2 bg-gradient-to-t from-accent to-purple rounded-full h-8 animate-wave"></div>
            <div class="bar w-2 bg-gradient-to-t from-accent to-purple rounded-full h-4 animate-wave"></div>
        </div>

        <!-- Timer & Progress -->
        <div class="flex flex-col items-center mb-10 w-full max-w-[400px]">
            <div class="text-6xl font-mono font-medium text-white tracking-wider mb-4 tabular-nums">1:34</div>
            
            <!-- Sweet Spot Indicator -->
            <div class="w-full h-1.5 bg-[#2a2b32] rounded-full relative overflow-hidden mb-2">
                <!-- Current Progress -->
                <div class="absolute left-0 top-0 h-full bg-accent w-[52%] z-20 rounded-full"></div>
                <!-- Sweet Spot Range (1-3 mins) - roughly 33% to 100% of a 3 min bar visually -->
                <div class="absolute left-[33%] right-0 top-0 h-full bg-success/20 z-10"></div>
            </div>
            
            <div class="flex justify-between w-full text-xs font-mono text-secondary mt-1">
                <span>0:00</span>
                <span class="text-success font-bold">Sweet Spot (1-3m)</span>
                <span>3:00+</span>
            </div>
        </div>

        <!-- Recording Status -->
        <div class="flex items-center gap-3 mb-12 bg-[#2a2b32]/50 px-4 py-2 rounded-full border border-[#2a2b32]">
            <div class="relative flex h-3 w-3">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-danger opacity-75"></span>
              <span class="relative inline-flex rounded-full h-3 w-3 bg-danger"></span>
            </div>
            <span class="text-sm font-medium text-white tracking-wide uppercase">Recording...</span>
        </div>

        <!-- Action Buttons -->
        <div class="flex gap-4 w-full max-w-[400px]">
            <button class="flex-1 bg-transparent border border-border hover:border-secondary text-white text-base font-semibold py-3.5 rounded-xl transition-all duration-200 flex items-center justify-center gap-2 group">
                <i class="fa-solid fa-pause text-sm"></i>
                <span>Pause</span>
            </button>
            <button class="flex-1 bg-accent hover:bg-accentHover text-white text-base font-semibold py-3.5 rounded-xl transition-all duration-200 shadow-[0_0_20px_rgba(59,130,246,0.2)] hover:shadow-[0_0_30px_rgba(59,130,246,0.4)] flex items-center justify-center gap-2 transform active:scale-[0.98]">
                <div class="w-2.5 h-2.5 bg-white rounded-sm"></div>
                <span>I'm done</span>
            </button>
        </div>

    </main>

    <!-- Footer Empty Spacer to balance layout -->
    <footer id="footer" class="w-full py-8 relative z-10 h-16">
    </footer>

    <!-- Background Decoration (Subtle Glows) -->
    <div class="fixed top-0 left-0 w-full h-full pointer-events-none z-0 overflow-hidden">
        <!-- Center Glow behind visualizer -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-accent/5 rounded-full blur-[120px]"></div>
        <!-- Bottom Right Glow -->
        <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-purple/5 rounded-full blur-[100px]"></div>
    </div>

    <!-- Bottom Nav Bar (Contextual for Onboarding) -->
    <div class="fixed bottom-0 w-full h-[40px] border-t border-[#2a2b32] bg-[#131316] flex items-center justify-between px-6 z-50">
        <div class="flex gap-2">
            <!-- Pagination Dots -->
            <div class="w-2 h-2 rounded-full bg-[#2a2b32]"></div>
            <div class="w-2 h-2 rounded-full bg-white"></div>
            <div class="w-2 h-2 rounded-full bg-[#2a2b32]"></div>
            <div class="w-2 h-2 rounded-full bg-[#2a2b32]"></div>
            <div class="w-2 h-2 rounded-full bg-[#2a2b32]"></div>
            <div class="w-2 h-2 rounded-full bg-[#2a2b32]"></div>
        </div>
        
        <div class="text-xs font-mono text-secondary">
            Screen 2 of 14: Recording
        </div>

        <div class="flex gap-4">
            <button class="text-xs text-secondary hover:text-white">
                <i class="fa-solid fa-chevron-left mr-1"></i> Previous
            </button>
            <button class="text-xs text-secondary hover:text-white">
                Next <i class="fa-solid fa-chevron-right ml-1"></i>
            </button>
        </div>
    </div>

    <!-- Script to rotate prompts -->
    <script>
        const prompts = [
            "Tell me about yourself...",
            "What topics could you talk about for hours?",
            "How would your friends describe you?"
        ];
        
        let currentPromptIndex = 0;
        const promptElement = document.getElementById('prompt-text');
        
        setInterval(() => {
            // Fade out
            promptElement.style.opacity = '0';
            promptElement.style.transform = 'translateY(10px)';
            
            setTimeout(() => {
                // Change text
                currentPromptIndex = (currentPromptIndex + 1) % prompts.length;
                promptElement.innerText = prompts[currentPromptIndex];
                
                // Fade in
                promptElement.style.opacity = '1';
                promptElement.style.transform = 'translateY(0)';
            }, 500); // Wait for fade out transition
            
        }, 5000); // Change every 5 seconds
    </script>

</body>
</html>
